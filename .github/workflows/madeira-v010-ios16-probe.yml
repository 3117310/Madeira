name: Madeira v0.1.0 iOS16 Probe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch v0.1.0 from upstream
        run: |
          git fetch https://github.com/willfaust/Madeira.git refs/tags/v0.1.0:refs/tags/v0.1.0
          git checkout v0.1.0
          git submodule update --init --recursive

      - name: Xcode 版本
        run: xcodebuild -version && xcodebuild -showsdks | grep iOS

      - name: 安装 brew 依赖
        run: |
          brew install cmake ninja meson pkg-config autoconf automake libtool bison flex sevenzip llvm

      - name: 占位缺失目录
        run: |
          mkdir -p app/Madeira/x86_64-vcruntime
          mkdir -p app/Madeira/fonts-ja

      - name: 编译（目标 iOS 16.0，不签名）
        env:
          GITHUB_ACTIONS: "true"
        run: |
          set -o pipefail
          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

      - name: 统计错误
        if: always()
        run: |
          echo "=== Swift 编译次数 ==="
          grep -c "SwiftCompile" build.log || true
          echo "=== 可用性错误总数 ==="
          grep -c "only available in iOS" build.log || true
          echo "=== 可用性版本分布 ==="
          grep -o "only available in iOS [0-9.]*" build.log | sort | uniq -c | sort -rn || true
          echo "=== 失败文件 Top 15 ==="
          grep "error:" build.log | grep -oE "[A-Za-z0-9_+.-]+\.swift" | sort | uniq -c | sort -rn | head -15 || true

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madeira-v010-build-log
          path: build.log
          retention-days: 7
