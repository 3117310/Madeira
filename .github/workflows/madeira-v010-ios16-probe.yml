name: Madeira v0.1.0 iOS16 Probe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch v010 tag
        run: |
          git fetch https://github.com/willfaust/Madeira.git refs/tags/v0.1.0:refs/tags/v0.1.0
          git checkout v0.1.0
          git submodule update --init --recursive

      - name: Patch Observable
        run: |
          FILE="app/Madeira/SwiftSteam/Core/SteamSession.swift"
          echo "=== FILE PATH ==="
          ls -la "$FILE"
          echo "=== BEFORE ==="
          cat -n "$FILE" | head -20
          sed -i '' 's/@Observable//g' "$FILE"
          sed -i '' 's/class SteamSession {/class SteamSession: ObservableObject {/' "$FILE"
          echo "=== AFTER ==="
          cat -n "$FILE" | head -20
          echo "=== grep Observable ==="
          grep -n "Observable" "$FILE" || echo "none"

      - name: Xcode version
        run: xcodebuild -version

      - name: Install deps
        run: |
          brew install cmake ninja meson pkg-config autoconf automake libtool bison flex sevenzip llvm

      - name: Placeholder dirs
        run: |
          mkdir -p app/Madeira/x86_64-vcruntime
          mkdir -p app/Madeira/fonts-ja

      - name: Build
        env:
          GITHUB_ACTIONS: "true"
        run: |
          set -o pipefail
          FILE="app/Madeira/SwiftSteam/Core/SteamSession.swift"
          echo "=== FINAL FILE CONTENT ===" > build.log
          cat -n "$FILE" >> build.log
          echo "" >> build.log
          echo "=== XCODEBUILD OUTPUT ===" >> build.log
          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee -a build.log

      - name: Stats
        if: always()
        run: |
          echo "=== Availability errors ==="
          grep -c "only available in iOS" build.log || true
          echo "=== Total errors ==="
          grep -c "error:" build.log || true

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madeira-v010-build-log
          path: build.log
          retention-days: 7
