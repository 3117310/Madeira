name: Madeira v0.1.0 iOS16 Probe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch v0.1.0 from upstream
        run: |
          git fetch https://github.com/willfaust/Madeira.git refs/tags/v0.1.0:refs/tags/v0.1.0
          git checkout v0.1.0
          git submodule update --init --recursive

      - name: Patch Observable for iOS 16
        run: |
          FILE="app/Madeira/SwiftSteam/Core/SteamSession.swift"
          sed -i '' '/^@Observable$/d' "$FILE"
          sed -i '' 's/^class SteamSession {$/class SteamSession: ObservableObject {/' "$FILE"
          sed -i '' 's/private(set) var connectionState/@Published private(set) var connectionState/' "$FILE"
          sed -i '' 's/private(set) var steamID/@Published private(set) var steamID/' "$FILE"
          sed -i '' 's/private(set) var accountName/@Published private(set) var accountName/' "$FILE"
          sed -i '' 's/private(set) var personaName/@Published private(set) var personaName/' "$FILE"
          sed -i '' 's/private(set) var cellID/@Published private(set) var cellID/' "$FILE"
          sed -i '' 's/private(set) var isSuspended/@Published private(set) var isSuspended/' "$FILE"
          head -20 "$FILE"

      - name: Xcode version
        run: xcodebuild -version

      - name: Install brew deps
        run: |
          brew install cmake ninja meson pkg-config autoconf automake libtool bison flex sevenzip llvm

      - name: Placeholder dirs
        run: |
          mkdir -p app/Madeira/x86_64-vcruntime
          mkdir -p app/Madeira/fonts-ja

      - name: Build for iOS 16.0
        env:
          GITHUB_ACTIONS: "true"
        run: |
          set -o pipefail
          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

      - name: Stats
        if: always()
        run: |
          echo "=== Swift compiles ==="
          grep -c "SwiftCompile" build.log || true
          echo "=== Availability errors ==="
          grep -c "only available in iOS" build.log || true
          echo "=== Availability versions ==="
          grep -o "only available in iOS [0-9.]*" build.log | sort | uniq -c | sort -rn || true
          echo "=== Total errors ==="
          grep -c "error:" build.log || true
          echo "=== Top failing files ==="
          grep "error:" build.log | grep -oE "[A-Za-z0-9_+.-]+\.swift" | sort | uniq -c | sort -rn | head -15 || true

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madeira-v010-build-log
          path: build.log
          retention-days: 7
