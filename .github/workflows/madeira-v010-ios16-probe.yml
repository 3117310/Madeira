name: Madeira v0.1.0 iOS16 Probe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch v0.1.0 from upstream
        run: |
          git fetch https://github.com/willfaust/Madeira.git refs/tags/v0.1.0:refs/tags/v0.1.0
          git checkout v0.1.0
          git submodule update --init --recursive

      - name: Debug: show SteamSession before patch
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== File exists? ==="
          ls -la app/Madeira/SwiftSteam/Core/SteamSession.swift
          echo "=== Lines 10-20 with line numbers ==="
          cat -n app/Madeira/SwiftSteam/Core/SteamSession.swift | sed -n '10,20p'
          echo "=== grep @Observable ==="
          grep -n "@Observable" app/Madeira/SwiftSteam/Core/SteamSession.swift || echo "NOT FOUND"

      - name: Patch Observable for iOS 16
        run: |
          FILE="app/Madeira/SwiftSteam/Core/SteamSession.swift"
          # Use python3 for reliable editing
          python3 -c "
import re
with open('$FILE', 'r') as f:
    content = f.read()
# Remove @Observable line
content = re.sub(r'^@Observable\n', '', content, flags=re.MULTILINE)
# Add ObservableObject protocol
content = content.replace('class SteamSession {', 'class SteamSession: ObservableObject {')
# Add @Published to the 6 published properties
for prop in ['connectionState', 'steamID', 'accountName', 'personaName', 'cellID', 'isSuspended']:
    content = content.replace(f'private(set) var {prop}', f'@Published private(set) var {prop}')
with open('$FILE', 'w') as f:
    f.write(content)
print('Patch done')
"
          echo "=== After patch: lines 10-20 ==="
          cat -n "$FILE" | sed -n '10,20p'
          echo "=== After patch: grep Observable ==="
          grep -n "Observable" "$FILE" || echo "No Observable found"

      - name: Xcode version
        run: xcodebuild -version

      - name: Install brew deps
        run: |
          brew install cmake ninja meson pkg-config autoconf automake libtool bison flex sevenzip llvm

      - name: Placeholder dirs
        run: |
          mkdir -p app/Madeira/x86_64-vcruntime
          mkdir -p app/Madeira/fonts-ja

      - name: Build for iOS 16.0
        env:
          GITHUB_ACTIONS: "true"
        run: |
          set -o pipefail
          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

      - name: Stats
        if: always()
        run: |
          echo "=== Availability errors ==="
          grep -c "only available in iOS" build.log || true
          echo "=== Total errors ==="
          grep -c "error:" build.log || true

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madeira-v010-build-log
          path: build.log
          retention-days: 7
